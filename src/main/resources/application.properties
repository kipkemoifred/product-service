spring.application.name=product-service

spring.datasource.url=jdbc:postgresql://localhost:5435/user-service-supply-chain
spring.datasource.username=postgres
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# JPA / Hibernate Configuration (validated against Flyway managed schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Inventory Business Configuration
inventory.allow-negative=false
inventory.back-office.auto-sync=true
inventory.supplier.auto-sync=true

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none

